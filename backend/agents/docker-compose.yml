services:
  zord-prompt-layer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zord-prompt-layer
    ports:
      - "8086:8086"
    env_file:
      - path: ./.env
        required: false
    environment:
      - REDIS_URL=redis://zord-prompt-layer-redis:6379/0
      - MEMORY_TTL_SECONDS=3600
      - MEMORY_MAX_TURNS=8
      - VECTOR_INDEX_KAFKA_BROKERS=broker1:9092,broker2:9093,broker3:9094
      - VECTOR_INDEX_KAFKA_TOPIC=zord.vector.index.request.v1
      - VECTOR_INDEX_KAFKA_GROUP_ID=zord-prompt-layer-vector-indexer
      - VECTOR_INDEX_KAFKA_MAX_RETRIES=3
      - VECTOR_INDEX_STATE_DSN=postgres://zpl:${AGENTS_POSTGRES_PASSWORD:?set AGENTS_POSTGRES_PASSWORD (see backend/agents/.env.example)}@zord-prompt-layer-postgres:5432/zord_prompt_layer_db?sslmode=disable
    networks:
      - zord-network
    depends_on:
      - zord-prompt-layer-redis
      - zord-prompt-layer-postgres
    restart: unless-stopped

  zord-prompt-layer-redis:
    image: redis:7-alpine
    container_name: zord-prompt-layer-redis
    command: ["redis-server", "--appendonly", "no"]
    networks:
      - zord-network
    restart: unless-stopped
    
  zord-prompt-layer-postgres:
    image: postgres:16-alpine
    container_name: zord-prompt-layer-postgres
    environment:
      POSTGRES_USER: zpl
      POSTGRES_PASSWORD: ${AGENTS_POSTGRES_PASSWORD:?set AGENTS_POSTGRES_PASSWORD}
      POSTGRES_DB: zord_prompt_layer_db
    volumes:
      - zord_prompt_layer_postgres_data:/var/lib/postgresql/data
    ports:
       - "5439:5432"
    networks:
      - zord-network
    restart: unless-stopped

networks:
  zord-network:
    external: true
    name: zord-shared-network

volumes:
  zord_prompt_layer_postgres_data: